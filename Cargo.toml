[package]
name = "dictum-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A local MCP project workspace for coding agents"
license = "MIT"

[lib]
name = "dictum_mcp"
path = "src/lib.rs"

[[bin]]
name = "dictum-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libc = "0.2"
rmcp = { version = "3.5.1", default-features = false, features = ["server", "macros", "transport-io"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
thiserror = "2.0"
uuid = { version = "1.26", features = ["v4", "v7"] }

[dev-dependencies]
rmcp = { version = "3.5.1", default-features = false, features = ["client", "transport-child-process"] }
tempfile = "3.23"
